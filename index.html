<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--sea:#0D1F26;--paper:#F2F1EC;--ink:#0D1F26;--line:rgba(13,31,38,.12);--teal:#3E8F86}
html,body{margin:0;padding:0}
body{font-family:'IBM Plex Sans KR',-apple-system,BlinkMacSystemFont,sans-serif;font-weight:300;
 background:var(--paper);color:var(--ink);-webkit-font-smoothing:antialiased}
#app{max-width:520px;margin:0 auto;padding-bottom:50px}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace}
button,input,textarea,select{font-family:inherit}
a{color:inherit}

.top{background:var(--sea);color:#EAF2F0;padding:12px 15px;display:flex;justify-content:space-between;
 align-items:center;gap:10px;padding-top:calc(12px + env(safe-area-inset-top))}
.top h1{margin:0;font-size:14px;font-weight:500}
.top p{margin:3px 0 0;font-size:10px;color:rgba(234,242,240,.5)}
.addbtn{border:1px solid rgba(255,255,255,.3);background:transparent;color:#EAF2F0;font-size:11.5px;
 padding:8px 11px;border-radius:3px;cursor:pointer;white-space:nowrap}

.mapwrap{background:var(--sea);line-height:0;position:relative}
.mapwrap svg{width:100%;height:auto;display:block}
.zoom{position:absolute;right:9px;top:9px;display:flex;flex-direction:column;gap:5px}
.zoom button{border:0;cursor:pointer;font-size:10.5px;font-weight:500;background:rgba(255,255,255,.14);
 color:#EAF2F0;padding:7px 10px;border-radius:3px}
.zoom button[aria-pressed="true"]{background:#EAF2F0;color:#0D1F26}

.chips{display:flex;gap:6px;padding:11px 15px;overflow-x:auto;border-bottom:1px solid var(--line);
 -webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chip{cursor:pointer;font-size:12.5px;font-weight:500;white-space:nowrap;border:1px solid var(--line);
 background:transparent;color:rgba(13,31,38,.45);padding:8px 13px;border-radius:999px}
.chip[aria-pressed="true"]{border-color:transparent;color:#0D1F26}

.days{display:flex;gap:6px;padding:11px 15px 0}
.day{flex:1;cursor:pointer;font-size:12.5px;font-weight:500;border:1px solid var(--line);
 background:transparent;color:rgba(13,31,38,.45);padding:10px 4px;border-radius:3px}
.day[aria-pressed="true"]{color:#fff;border-color:transparent}

.body{padding:0 15px}
.card{background:#fff;border:1px solid var(--line);border-radius:5px;padding:14px;margin:14px 0}
.card h2{margin:0;font-size:17px;font-weight:500;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tagr{font-size:11px;background:rgba(62,143,134,.14);color:#1F6A63;padding:2px 6px;border-radius:2px}
.tagu{font-size:10.5px;background:rgba(183,155,224,.22);color:#5B3E86;padding:2px 6px;border-radius:2px}
.sub{font-size:11px;color:rgba(13,31,38,.5);margin-top:6px;line-height:1.6}
.desc{font-size:13px;line-height:1.7;margin:10px 0 0}
.warn{display:inline-block;margin-top:9px;font-size:11px;background:rgba(255,194,77,.25);
 border-left:3px solid #FFC24D;padding:5px 8px;color:#6B4C08;border-radius:0 2px 2px 0}
.acts{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap}
.b{cursor:pointer;font-size:12px;text-decoration:none;display:inline-block;border:1px solid var(--line);
 background:transparent;color:rgba(13,31,38,.75);padding:10px 13px;border-radius:3px}
.b.pri{background:var(--ink);color:#fff;border-color:var(--ink)}
.b.danger{background:#fff;color:#B04A3A;border-color:#E6C2BC}

.h{font-size:10.5px;letter-spacing:.18em;color:var(--teal);margin:22px 0 8px}
.row{display:flex;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);
 width:100%;text-align:left;background:none;border-left:0;border-right:0;border-top:0;cursor:pointer}
.dot{flex:0 0 22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;
 font-size:10px;color:#0D1F26;font-weight:500}
.dot.sq{border-radius:3px}
.n{font-size:13.5px;font-weight:500;display:block}
.m{font-size:10.5px;color:rgba(13,31,38,.45);margin-top:2px;display:block}
.rt{margin-left:auto;font-size:11px;color:rgba(13,31,38,.5);white-space:nowrap;text-align:right}
.leg{padding:5px 0 5px 32px;font-size:11px;color:rgba(13,31,38,.45)}
.empty{font-size:12.5px;line-height:1.75;color:rgba(13,31,38,.45);padding:18px 0;text-align:center}
.sum{background:var(--sea);color:#EAF2F0;border-radius:5px;padding:13px 14px;margin-top:12px}
.sum b{font-size:15px;font-weight:500}
.sum span{display:block;font-size:11px;color:rgba(234,242,240,.55);margin-top:3px;line-height:1.6}
.foot{font-size:11px;line-height:1.85;color:rgba(13,31,38,.42);margin-top:26px;padding-top:14px;
 border-top:1px solid var(--line)}
.ord{border:1px solid var(--line);background:#fff;border-radius:3px;width:30px;height:30px;
 font-size:14px;cursor:pointer;color:rgba(13,31,38,.6);line-height:1}

.form label{display:block;font-size:10.5px;letter-spacing:.1em;color:rgba(13,31,38,.5);margin:13px 0 5px}
.form input,.form textarea{width:100%;font-size:16px;font-weight:300;border:1px solid var(--line);
 border-radius:3px;padding:11px;background:#fff;color:var(--ink)}
.form textarea{min-height:64px;resize:vertical;line-height:1.6}
.form input:focus,.form textarea:focus{outline:2px solid var(--teal);outline-offset:-1px}
.cats{display:flex;gap:6px;flex-wrap:wrap}
.cat{cursor:pointer;font-size:12.5px;border:1px solid var(--line);background:#fff;padding:9px 13px;
 border-radius:999px;color:rgba(13,31,38,.5);font-weight:500}
.cat[aria-pressed="true"]{border-color:transparent;color:#0D1F26}
.note{font-size:11px;line-height:1.7;color:rgba(13,31,38,.5);margin-top:7px;background:rgba(62,143,134,.09);
 padding:9px 10px;border-radius:3px}
.two{display:flex;gap:6px}
</style>

/* ═══════════ 거리 · 시간 ═══════════ */
function straight(a,b){var t=function(x){return x*Math.PI/180};
 var dLa=t(b.lat-a.lat),dLo=t(b.lng-a.lng);
 return 2*6371*Math.asin(Math.sqrt(Math.pow(Math.sin(dLa/2),2)+Math.cos(t(a.lat))*Math.cos(t(b.lat))*Math.pow(Math.sin(dLo/2),2)));}
function roadKm(a,b){return straight(a,b)*1.3}
function mins(a,b){var k=roadKm(a,b);var v=k<10?36:(k<30?45:52);return Math.max(4,Math.round(k/v*60));}
function fkm(v){return (v<10?v.toFixed(1):Math.round(v))+"km"}
function fhm(m){return m>=60?(Math.floor(m/60)+"시간 "+(m%60?m%60+"분":"")).trim():m+"분"}

}
function gRoute(list){

  var o=pts[0], d=pts[pts.length-1], mid=pts.slice(1,-1);
  var u="https://www.google.com/maps/dir/?api=1&origin="+encodeURIComponent(target(o))
    +"&destination="+encodeURIComponent(target(d))+"&travelmode=driving";

 S.edits=saved.edits||{}; S.removed=saved.removed||[]; }

  var base=SEED.concat(S.custom).map(function(p){
    return S.edits[p.id] ? Object.assign({},p,S.edits[p.id]) : p;
  });
  return base.concat(LPG).filter(function(p){ return S.removed.indexOf(p.id)<0; });
}
function byId(id){ var a=allPlaces(); for(var i=0;i<a.length;i++) if(a[i].id===id) return a[i]; return null; }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }

/* ═══════════ 지도 ═══════════ */
function renderMap(){
  var vb=VIEWS[S.view], R=Math.max(7,vb[2]/48), HIT=R*2.6;
  var list=allPlaces().filter(function(p){return S.filt[p.cat]});
  var cur=S.course[S.day];
  var g='';

  g+='<rect x="'+vb[0]+'" y="'+vb[1]+'" width="'+vb[2]+'" height="'+vb[3]+'" fill="url(#sg)"/>';
  g+='<path d="'+COASTPATH+'" fill="url(#lg)" stroke="#3E8F86" stroke-width="'+(vb[2]/500)+'" stroke-linejoin="round"/>';
  g+='<ellipse cx="'+px(126.952)+'" cy="'+py(33.505)+'" rx="9" ry="6" fill="url(#lg)" stroke="#3E8F86" stroke-width="'+(vb[2]/700)+'"/>';
  [46,34,23,13].forEach(function(r,i){
    g+='<circle cx="'+px(126.533)+'" cy="'+py(33.361)+'" r="'+r+'" fill="none" stroke="rgba(62,143,134,.3)" stroke-width="'+(i===3?vb[2]/600:vb[2]/900)+'"/>';
  });

  S.course.forEach(function(ids,di){
    if(!ids.length) return;
    var pts=[BASE].concat(ids.map(byId).filter(Boolean),[BASE]);
    g+='<polyline points="'+pts.map(function(p){return px(p.lng)+","+py(p.lat)}).join(" ")+'" fill="none" stroke="'
      +DAYC[di]+'" stroke-width="'+(vb[2]/230)+'" stroke-opacity="'+(di===S.day?.95:.3)
      +'" stroke-dasharray="'+(vb[2]/120)+' '+(vb[2]/160)+'" stroke-linecap="round"/>';
  });

  list.forEach(function(p){
    var idx=cur.indexOf(p.id), isSel=S.sel===p.id;
    var c=idx>=0?DAYC[S.day]:CAT[p.cat].color;
    var X=px(p.lng), Y=py(p.lat);
    g+='<g class="pin" data-id="'+p.id+'" style="cursor:pointer">';
    g+='<circle cx="'+X+'" cy="'+Y+'" r="'+HIT+'" fill="transparent"/>';
    if(p.cat==="lpg"){
      g+='<rect x="'+(X-R*.8)+'" y="'+(Y-R*.8)+'" width="'+(R*1.6)+'" height="'+(R*1.6)+'" transform="rotate(45 '+X+' '+Y+')" fill="#FFC24D" stroke="'+(isSel?"#fff":"#8A6410")+'" stroke-width="'+(isSel?R*.3:R*.12)+'"/>';
    } else if(p.cat==="car"){
      g+='<rect x="'+(X-R*.95)+'" y="'+(Y-R*.75)+'" width="'+(R*1.9)+'" height="'+(R*1.5)+'" rx="'+(R*.3)+'" fill="#B79BE0" stroke="'+(isSel?"#fff":"rgba(13,31,38,.45)")+'" stroke-width="'+(isSel?R*.28:R*.1)+'"/>';
    } else {
      g+='<circle cx="'+X+'" cy="'+Y+'" r="'+(isSel?R*1.3:R)+'" fill="'+c+'" stroke="'+(isSel?"#fff":"rgba(13,31,38,.45)")+'" stroke-width="'+(isSel?R*.28:R*.1)+'"/>';
      if(idx>=0) g+='<text x="'+X+'" y="'+(Y+R*.38)+'" font-size="'+(R*1.1)+'" text-anchor="middle" fill="#0D1F26" style="pointer-events:none;font-weight:600" class="mono">'+(idx+1)+'</text>';
    }
    if(isSel) g+='<text x="'+X+'" y="'+(Y-R*1.9)+'" font-size="'+(R*1.5)+'" text-anchor="middle" fill="#fff" style="pointer-events:none">'+esc(p.n)+'</text>';
    g+='</g>';
  });

  var BX=px(BASE.lng), BY=py(BASE.lat);
  g+='<g class="pin" data-id="base" style="cursor:pointer">'
    +'<circle cx="'+BX+'" cy="'+BY+'" r="'+HIT+'" fill="transparent"/>'
    +'<circle cx="'+BX+'" cy="'+BY+'" r="'+(R*1.8)+'" fill="none" stroke="#fff" stroke-width="'+(R*.1)+'" stroke-opacity=".55"/>'
    +'<circle cx="'+BX+'" cy="'+BY+'" r="'+(R*.9)+'" fill="#fff" stroke="#0D1F26" stroke-width="'+(R*.18)+'"/>'
    +'<text x="'+BX+'" y="'+(BY-R*2.6)+'" font-size="'+(R*1.5)+'" text-anchor="middle" fill="#fff" style="pointer-events:none">숙소</text></g>';

  return '<div class="mapwrap"><svg viewBox="'+vb.join(" ")+'" preserveAspectRatio="xMidYMid meet">'
    +'<defs><radialGradient id="sg" cx="50%" cy="45%" r="75%"><stop offset="0%" stop-color="#16333D"/><stop offset="100%" stop-color="#0B1A20"/></radialGradient>'
    +'<linearGradient id="lg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#EFEBDD"/><stop offset="100%" stop-color="#DBD5C3"/></linearGradient></defs>'
    +g+'</svg><div class="zoom">'
    +[["all","전체"],["east","동부"],["south","남부"]].map(function(v){
      return '<button data-view="'+v[0]+'" aria-pressed="'+(S.view===v[0])+'">'+v[1]+'</button>'}).join("")
    +'</div></div>';
}

/* ═══════════ 폼 ═══════════ */
function renderForm(){
  var f=S.form;
  var h='<div class="card form"><h2>'+(f.id?"장소 수정":"장소 추가")+'</h2>';
  h+='<label class="mono">이름</label><input id="fn" value="'+esc(f.n)+'" placeholder="예: 제주OK렌트카 본점">';
  h+='<label class="mono">분류</label><div class="cats">';
  Object.keys(CAT).forEach(function(k){
    if(k==="lpg"&&f.cat!=="lpg") return;
    h+='<button class="cat" data-cat="'+k+'" aria-pressed="'+(f.cat===k)+'" style="'+(f.cat===k?"background:"+CAT[k].color:"")+'">'+CAT[k].label+'</button>';
  });
  h+='</div>';
  h+='<label class="mono">주소</label><input id="fa" value="'+esc(f.addr||"")+'" placeholder="예: 제주시 용문로 64">';
  h+='<div class="note">주소에 읍·면·동이나 도로명이 있으면 그 지역에 표시됩니다. 정확히 찍으려면 구글맵에서 해당 지점을 길게 눌러 나오는 위도·경도를 아래에 넣으세요.</div>';
  h+='<label class="mono">위도 · 경도 (선택)</label><div class="two">'
    +'<input id="flat" value="'+esc(f.lat||"")+'" placeholder="33.504" inputmode="decimal">'
    +'<input id="flng" value="'+esc(f.lng||"")+'" placeholder="126.503" inputmode="decimal"></div>';
  h+='<label class="mono">머무는 시간 (분)</label><input id="fs" value="'+esc(f.stay||45)+'" inputmode="numeric">';
  h+='<label class="mono">전화 (선택)</label><input id="fp" value="'+esc(f.p||"")+'" placeholder="064-000-0000" inputmode="tel">';
  h+='<label class="mono">메모</label><textarea id="fd" placeholder="무엇을 먹을지, 왜 가는지">'+esc(f.d||"")+'</textarea>';
  h+='<label class="mono">영업시간 · 휴무</label><input id="fw" value="'+esc(f.w||"")+'" placeholder="예: 수요일 휴무 · 21:00 마감">';
  h+='<div class="acts"><button class="b pri" data-act="save">저장</button>'
    +'<button class="b" data-act="cancel">취소</button>';
  if(f.addr) h+='<a class="b" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(f.addr)+'">주소 확인</a>';
  h+='</div></div>';
  return h;
}

/* ═══════════ 상세 카드 ═══════════ */
function renderCard(){
  var o = S.sel==="base" ? BASE : byId(S.sel);
  if(!o) return "";
  var cur=S.course[S.day], added=cur.indexOf(o.id)>=0;
  var isSeed = SEED.some(function(s){return s.id===o.id});
  var h='<div class="card"><h2>'+esc(o.n);
  if(o.r) h+='<span class="tagr mono">★ '+Number(o.r).toFixed(1)+'</span>';
  if(o.approx) h+='<span class="tagu mono">위치 대략</span>';
  h+='</h2>';
  h+='<div class="sub mono">'+(o.id==="base"?esc(o.addr)
    : CAT[o.cat].label+(o.addr?" · "+esc(o.addr):"")+(o.cat!=="lpg"?" · 체류 "+o.stay+"분":"")
      +" · 숙소에서 약 "+fhm(mins(BASE,o)))+'</div>';
  if(o.d) h+='<p class="desc">'+esc(o.d)+'</p>';
  if(o.id==="base") h+='<p class="desc">표선면 하천리. 번영로가 바로 옆이라 제주시·공항 접근이 좋습니다.</p>';
  if(o.w) h+='<div class="warn mono">'+esc(o.w)+'</div>';
  if(o.approx) h+='<div class="warn mono">'+esc(o.area)+' 부근에 찍힌 대략 위치입니다. 수정에서 좌표를 넣으면 정확해집니다.</div>';
  h+='<div class="acts">';
  if(o.id!=="base"&&o.cat!=="lpg")
    h+= added ? '<button class="b danger" data-act="del" data-id="'+o.id+'">DAY '+(S.day+1)+'에서 빼기</button>'
              : '<button class="b pri" data-act="add" data-id="'+o.id+'">DAY '+(S.day+1)+'에 추가</button>';
  h+='<a class="b" target="_blank" rel="noopener" href="'+gPlace(o)+'">구글맵</a>';
  if(o.id!=="base") h+='<a class="b" target="_blank" rel="noopener" href="'+gDir(BASE,o)+'">길찾기 (소요시간)</a>';
  if(o.p) h+='<a class="b" href="tel:'+o.p.replace(/-/g,"")+'">전화</a>';
  if(o.id!=="base") h+='<button class="b" data-act="edit" data-id="'+o.id+'">수정</button>';
  if(o.id!=="base") h+='<button class="b danger" data-act="remove" data-id="'+o.id+'">'+(isSeed?"목록에서 삭제":"삭제")+'</button>';
  h+='</div></div>';
  return h;
}

/* ═══════════ 전체 렌더 ═══════════ */
function render(){
  var list=allPlaces(), cur=S.course[S.day];
  var shown=list.filter(function(p){return S.filt[p.cat]});
  var stops=cur.map(byId).filter(Boolean);
  var pts=[BASE].concat(stops);
  var legs=pts.slice(1).map(function(p,i){return {m:mins(pts[i],p),k:roadKm(pts[i],p)}});
  var back=stops.length?{m:mins(stops[stops.length-1],BASE),k:roadKm(stops[stops.length-1],BASE)}:null;
  var drive=legs.reduce(function(a,l){return a+l.m},0)+(back?back.m:0);
  var stay=stops.reduce(function(a,p){return a+(parseInt(p.stay,10)||30)},0);

  var h='';
  h+='<div class="top"><div><h1>제주 코스 · 표선 베이스</h1>'
    +'<p class="mono">장소 '+list.filter(function(p){return p.cat!=="lpg"}).length+' · LPG '+LPG.filter(function(p){return S.removed.indexOf(p.id)<0}).length+' · 소요시간 추정</p></div>'
    +'<button class="addbtn" data-act="new">+ 장소 추가</button></div>';

  h+=renderMap();

  h+='<div class="chips">';
  Object.keys(CAT).forEach(function(k){
    h+='<button class="chip" data-filt="'+k+'" aria-pressed="'+(!!S.filt[k])+'" style="'+(S.filt[k]?"background:"+CAT[k].color:"")+'">'
      +CAT[k].label+' '+list.filter(function(p){return p.cat===k}).length+'</button>';
  });
  h+='</div>';

  h+='<div class="days">';
  [0,1,2].forEach(function(i){
    h+='<button class="day" data-day="'+i+'" aria-pressed="'+(S.day===i)+'" style="'+(S.day===i?"background:"+DAYC[i]:"")+'">DAY '+(i+1)
      +(S.course[i].length?' · '+S.course[i].length:'')+'</button>';
  });
  h+='</div><div class="body">';

  if(S.form) h+=renderForm();
  else if(S.sel) h+=renderCard();
  else h+='<p class="empty">지도의 점이나 아래 목록을 눌러 장소를 고르고,<br>「DAY '+(S.day+1)+'에 추가」를 누르면 경로가 이어집니다.</p>';

  h+='<div class="h mono">DAY '+(S.day+1)+' 코스</div>';
  if(!stops.length) h+='<p class="empty">아직 비어 있습니다.</p>';
  else{
    h+='<div class="leg mono">숙소 출발</div>';
    stops.forEach(function(p,i){
      h+='<div class="leg mono">▼ 약 '+fhm(legs[i].m)+' · '+fkm(legs[i].k)+'</div>';
      h+='<div class="row" style="cursor:default"><span class="dot" style="background:'+DAYC[S.day]+'">'+(i+1)+'</span>'
        +'<span style="flex:1;min-width:0;cursor:pointer" data-act="sel" data-id="'+p.id+'">'
        +'<span class="n">'+esc(p.n)+'</span><span class="m mono">'+(p.r?"★"+p.r+" · ":"")+CAT[p.cat].label+' · '+p.stay+'분</span></span>'
        +'<span style="display:flex;gap:4px">'
        +'<button class="ord" data-act="up" data-i="'+i+'">↑</button>'
        +'<button class="ord" data-act="down" data-i="'+i+'">↓</button>'
        +'<button class="ord" data-act="del" data-id="'+p.id+'">×</button></span></div>';
    });
    h+='<div class="leg mono">▼ 약 '+fhm(back.m)+' · '+fkm(back.k)+'</div><div class="leg mono">숙소 도착</div>';
    h+='<div class="sum"><b>이동 '+fhm(drive)+' + 체류 '+fhm(stay)+'</b>'
      +'<span>합계 약 '+fhm(drive+stay)+' · 총 '+fkm(legs.reduce(function(a,l){return a+l.k},0)+back.k)+'</span></div>';
    h+='<div class="acts"><a class="b pri" target="_blank" rel="noopener" href="'+gRoute(stops)+'">구글맵에서 전체 경로 열기</a>'
      +'<button class="b" data-act="clear">비우기</button></div>';
  }

  h+='<div class="h mono">후보 · 숙소에서 가까운 순</div>';
  shown.filter(function(p){return p.cat!=="lpg"})
    .map(function(p){return {p:p,m:mins(BASE,p)}})
    .sort(function(a,b){return a.m-b.m})
    .forEach(function(x){
      var i=cur.indexOf(x.p.id);
      h+='<button class="row" data-act="sel" data-id="'+x.p.id+'">'
        +'<span class="dot'+(x.p.cat==="car"||x.p.cat==="lpg"?" sq":"")+'" style="background:'+CAT[x.p.cat].color+'">'+(i>=0?i+1:"")+'</span>'
        +'<span style="flex:1;min-width:0"><span class="n">'+esc(x.p.n)+(x.p.user?" ✎":"")+'</span>'
        +'<span class="m mono">'+(x.p.r?"★"+x.p.r+" · ":"")+CAT[x.p.cat].label+(x.p.approx?" · 위치 대략":"")+'</span></span>'
        +'<span class="rt mono">차로<br>'+fhm(x.m)+'</span></button>';
    });

  if(S.filt.lpg){
    h+='<div class="h mono">LPG 충전소 · 숙소에서 가까운 순</div>';
    shown.filter(function(p){return p.cat==="lpg"})
      .map(function(p){return {p:p,m:mins(BASE,p)}})
      .sort(function(a,b){return a.m-b.m})
      .forEach(function(x){
        h+='<button class="row" data-act="sel" data-id="'+x.p.id+'">'
          +'<span class="dot sq" style="background:#FFC24D">'+(x.p.key?"★":"")+'</span>'
          +'<span style="flex:1;min-width:0"><span class="n">'+esc(x.p.n)+'</span>'
          +'<span class="m mono">'+esc(x.p.addr)+' · '+esc(x.p.w)+'</span></span>'
          +'<span class="rt mono">차로<br>'+fhm(x.m)+'</span></button>';
      });
  }

  if(S.removed.length)
    h+='<div class="acts" style="margin-top:16px"><button class="b" data-act="restore">삭제한 장소 '+S.removed.length+'곳 되돌리기</button></div>';

  h+='<div class="foot">코스와 직접 추가한 장소는 이 브라우저에 저장됩니다. 소요시간은 직선거리에 제주 도로 '
    +'우회계수와 구간별 속도를 적용한 추정값이고, 「길찾기」와 「전체 경로 열기」를 누르면 구글맵이 실제 '
    +'소요시간을 계산해 보여줍니다. 장소는 주소로 검색되며 구글 Place ID가 있으면 상호로 바로 열립니다.</div>';
  h+='</div>';

  document.getElementById("app").innerHTML=h;
}

/* ═══════════ 이벤트 ═══════════ */
function saveForm(){
  var f=S.form;
  var n=document.getElementById("fn").value.trim();
  if(!n){ alert("이름을 입력해 주세요."); return; }
  var addr=document.getElementById("fa").value.trim();
  var lat=parseFloat(document.getElementById("flat").value);
  var lng=parseFloat(document.getElementById("flng").value);
  var approx=false, area=null;
  if(!(lat>=33&&lat<=34&&lng>=126&&lng<=127.2)){
    var g=geocode(addr);
    if(!g){ alert("주소에서 제주 지역명을 찾지 못했습니다.\n읍·면·동이나 도로명이 들어간 주소를 넣거나, 위도·경도를 직접 입력해 주세요."); return; }
    lat=g.lat; lng=g.lng; approx=true; area=g.area;
  }
  var rec={id:f.id||("u"+Date.now()),n:n,cat:f.cat,addr:addr,lat:lat,lng:lng,
    stay:parseInt(document.getElementById("fs").value,10)||45,
    p:document.getElementById("fp").value.trim(),
    d:document.getElementById("fd").value.trim(),
    w:document.getElementById("fw").value.trim(),
    approx:approx,area:area,user:!f.seed,pid:f.pid,r:f.r};
  if(f.seed) S.edits[f.id]=rec;
  else if(f.id) S.custom=S.custom.map(function(x){return x.id===f.id?rec:x});
  else S.custom.push(rec);
  S.sel=rec.id; S.form=null; save(); render();
}

document.addEventListener("click",function(e){
  var t=e.target.closest("[data-view],[data-filt],[data-day],[data-cat],[data-act],.pin");
  if(!t) return;

  if(t.dataset.view){ S.view=t.dataset.view; render(); return; }
  if(t.dataset.filt){ S.filt[t.dataset.filt]=!S.filt[t.dataset.filt]; render(); return; }
  if(t.dataset.day!==undefined && t.classList.contains("day")){ S.day=+t.dataset.day; render(); return; }
  if(t.dataset.cat && S.form){ S.form.cat=t.dataset.cat; captureForm(); render(); return; }
  if(t.classList.contains("pin")){ S.sel=t.dataset.id; S.form=null; render(); window.scrollTo({top:document.querySelector(".chips").offsetTop-10,behavior:"smooth"}); return; }

  var a=t.dataset.act, id=t.dataset.id;
  if(a==="sel"){ S.sel=id; S.form=null; render(); return; }
  if(a==="new"){ S.form={n:"",cat:"food",addr:"",stay:45,d:"",w:"",p:"",lat:"",lng:""}; S.sel=null; render(); return; }
  if(a==="cancel"){ S.form=null; render(); return; }
  if(a==="save"){ saveForm(); return; }
  if(a==="edit"){ var o=byId(id);
    S.form={id:o.id,n:o.n,cat:o.cat,addr:o.addr||"",lat:o.lat,lng:o.lng,stay:o.stay,p:o.p||"",
      d:o.d||"",w:o.w||"",pid:o.pid,r:o.r,seed:SEED.some(function(s){return s.id===o.id})};
    render(); return; }
  if(a==="add"){ if(S.course[S.day].indexOf(id)<0) S.course[S.day].push(id); save(); render(); return; }
  if(a==="del"){ S.course[S.day]=S.course[S.day].filter(function(x){return x!==id}); save(); render(); return; }
  if(a==="remove"){
    var p=byId(id);
    if(!confirm('"'+p.n+'" 을(를) 목록에서 삭제할까요?')) return;
    S.removed.push(id);
    S.course=S.course.map(function(d){return d.filter(function(x){return x!==id})});
    S.custom=S.custom.filter(function(x){return x.id!==id});
    S.sel=null; save(); render(); return; }
  if(a==="restore"){ S.removed=[]; save(); render(); return; }
  if(a==="up"||a==="down"){
    var i=+t.dataset.i, j=i+(a==="up"?-1:1), d=S.course[S.day];
    if(j>=0&&j<d.length){ var tmp=d[i]; d[i]=d[j]; d[j]=tmp; save(); render(); }
    return; }
  if(a==="clear"){ S.course[S.day]=[]; save(); render(); return; }
});

function captureForm(){
  ["n:fn","addr:fa","lat:flat","lng:flng","stay:fs","p:fp","d:fd","w:fw"].forEach(function(pair){
    var kv=pair.split(":"), el=document.getElementById(kv[1]);
    if(el) S.form[kv[0]]=el.value;
  });
}

render();
</script>
</body>
</html>
